<title>신동읍 환경 구조대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: side-scrolling village on top (동이 walks it), a dialogue panel below where 동이 talks and missions are played. Single committed light look: watercolor paper + mountain mist, 동이's yellow hoodie as the one accent. */
:root{
  --mist:#e8f0ec;
  --paper:#fbfcf8;
  --ink:#213a38;
  --ink-soft:#56706c;
  --hoodie:#f2c928;
  --hoodie-deep:#b98a00;
  --leaf:#4f8a3c;
  --rust:#c4572e;
  --line:#c9d8d2;
  --display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hoodie-deep);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}

.app{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:12px 24px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 18px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--ink-soft)}
.top h1{font-size:clamp(26px,4.4vw,38px);line-height:1.1}
.top h1 em{font-style:normal;color:var(--hoodie-deep)}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap;flex:1;justify-content:flex-end}
.gauge{min-width:190px;flex:1;max-width:320px}
.gauge-label{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--ink-soft)}
.gauge-label b{font-family:var(--display);font-weight:400;font-size:26px;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1}
.gauge-track{height:14px;border-radius:99px;background:#d6ddd3;border:2px solid var(--ink);overflow:hidden;margin-top:3px}
.gauge-fill{height:100%;width:0;background:linear-gradient(90deg,var(--leaf),var(--hoodie));transition:width .9s cubic-bezier(.3,1.4,.5,1)}
.tools{display:flex;gap:6px}
.chip-btn{border:2px solid var(--ink);background:var(--paper);border-radius:99px;padding:5px 11px;font-size:14px;white-space:nowrap}
.chip-btn.warn{background:var(--rust);color:#fff;border-color:var(--rust)}

.mbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.mbar button{flex:none;display:flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);border-radius:99px;padding:4px 12px 4px 4px;font-family:var(--display);font-size:16px}
.mbar .b{width:24px;height:24px;border-radius:50%;background:var(--hoodie);border:2px solid var(--ink);display:grid;place-items:center;font-size:14px}
.mbar button.done .b{background:var(--leaf);color:#fff}
.mbar button.here{background:#fff3c4}

.stage{position:relative;height:clamp(320px,44vw,470px);max-height:62vh;min-height:280px;border:3px solid var(--ink);border-radius:20px;overflow:hidden;background:#cfc6b0;box-shadow:0 5px 0 var(--ink);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.stage svg{display:block;width:100%;height:100%}
#game{transition:filter 1.2s;cursor:pointer}
.banner{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--paper);border:2.5px solid var(--ink);border-radius:14px;padding:6px 16px;font-family:var(--display);font-size:clamp(18px,3vw,26px);white-space:nowrap;box-shadow:0 3px 0 var(--ink)}
.skip{position:absolute;right:10px;bottom:10px}

.t-slow{transition:fill 1.4s,opacity 1.4s}
.clean-sky,.bins-fill,.fish-clean,.bus-g,.far-trees,.m-tree,.solar,.shine{opacity:0}
.fix-air .clean-sky{opacity:1}
.fix-air .haze,.fix-air .smoke,.fix-air .fire{opacity:0!important}
.fix-forest .hills{fill:#7aab58}
.fix-forest .far-trees,.fix-forest .m-tree{opacity:1}
.fix-forest .mound,.fix-forest .stump{opacity:0}
.fix-river .water{fill:#4aa3c9}
.fix-river .w-trash,.fix-river .fish-dirty{display:none}
.fix-river .fish-clean,.fix-river .shine{opacity:1}
.fix-trash .pile{opacity:0}
.fix-trash .litter{opacity:0}
.fix-energy .solar{opacity:1}
.fix-energy .win{fill:#ffe38a}
.fix-traffic .car-g{opacity:0}
.fix-traffic .bus-g{opacity:1}
.m-tree.on,.solar.on{opacity:1}
.grow{animation:grow .7s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:50% 100%}
@keyframes grow{from{transform:scale(.1)}}
.rise{animation:rise 4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.rise:nth-child(2){animation-delay:-1.3s}.rise:nth-child(3){animation-delay:-2.6s}
@keyframes rise{from{opacity:.85;transform:translate(0,0) scale(.6)}to{opacity:0;transform:translate(20px,-120px) scale(2)}}
.bob{animation:bob 2.4s ease-in-out infinite;transform-box:fill-box}
.bob:nth-child(2n){animation-delay:-1.2s}.bob:nth-child(3n){animation-delay:-.6s}
@keyframes bob{50%{transform:translateY(-4px) rotate(-6deg)}}
.jump{animation:jump 1.6s ease-in-out infinite;transform-box:fill-box}
@keyframes jump{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-14px)}}
.mark{cursor:pointer}
.mark .ring{animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(2)}}
.mark text{font-family:var(--display);font-size:22px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tap{cursor:pointer}
.tap-hint{animation:ping 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.sign text{font-family:var(--display);font-size:15px;text-anchor:middle;fill:#3d2a17}
.fx text{font-family:var(--display)}

/* panel */
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:170px}
.talk{display:flex;gap:12px;align-items:flex-start}
.face{flex:none;width:clamp(68px,12vw,96px);aspect-ratio:1;border-radius:50%;border:3px solid var(--ink);background:#fff3c4;overflow:hidden;display:grid;place-items:end center}
.face img{width:112%;height:auto;display:block;margin-bottom:-6%}
.face.pop{animation:fpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes fpop{from{transform:scale(.85)}}
.say{min-width:0;flex:1}
.say .who{font-family:var(--display);font-size:15px;color:var(--hoodie-deep)}
.say h2{font-size:clamp(20px,3vw,25px);line-height:1.2}
.say p{margin:2px 0 0;font-size:16.5px}
.body{display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.btn{border:2.5px solid var(--ink);background:var(--hoodie);border-radius:14px;padding:9px 18px;font-family:var(--display);font-size:20px;box-shadow:0 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper)}
.btn.sm{font-size:16px;padding:6px 12px}
.pad{display:flex;gap:8px}
.pad button{width:64px;height:52px;border:2.5px solid var(--ink);border-radius:14px;background:#fff;font-size:22px;box-shadow:0 4px 0 var(--ink);touch-action:none}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.muted{color:var(--ink-soft);font-size:14px}
.counter{font-family:var(--display);font-size:18px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

.sort-item{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:8px 14px}
.sort-item .e{font-size:44px;line-height:1}
.sort-item .n{font-family:var(--display);font-size:21px;line-height:1.2}
.sort-item .h{font-size:14px;color:var(--ink-soft)}
.bins-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bin{border:2.5px solid var(--ink);border-radius:12px 12px 16px 16px;padding:12px 4px 10px;font-family:var(--display);font-size:18px;box-shadow:0 4px 0 var(--ink)}
.bin:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.q{font-family:var(--display);font-size:clamp(19px,2.8vw,23px);line-height:1.35;background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px}
.ox{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ox button{font-family:var(--display);font-size:42px;line-height:1;padding:10px 0;border:2.5px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.ox .o{color:#2d7fb0}.ox .x{color:var(--rust)}
.explain{background:#eef6e9;border:2px dashed var(--leaf);border-radius:12px;padding:8px 12px;font-size:15.5px}
.explain.bad{background:#fbece6;border-color:var(--rust)}
.offer{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.offer-act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;flex:1;min-width:0}
.photo{margin:0;display:flex;flex-direction:column;gap:2px}
.photo img{width:clamp(112px,18vw,170px);height:auto;border-radius:12px;border:2.5px solid var(--ink);display:block}
.photo figcaption{font-family:var(--display);font-size:13px;color:var(--ink-soft)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card-pick{border:2.5px solid var(--ink);border-radius:14px;background:#fff;padding:10px;font-size:15.5px;text-align:left;box-shadow:0 3px 0 var(--ink);min-width:0}
.card-pick.ok{background:#e1f0d6;border-color:var(--leaf)}
.card-pick.no{background:#fbe3da;border-color:var(--rust);text-decoration:line-through}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices button{border:2.5px solid var(--ink);border-radius:16px;background:#fff;padding:12px 10px;font-size:17px;box-shadow:0 4px 0 var(--ink);min-width:0}
@media (max-width:640px){.cards{grid-template-columns:1fr 1fr}.bins-grid{grid-template-columns:repeat(2,1fr)}}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(24,44,42,.55);display:grid;place-items:center;padding:16px;z-index:10;overflow-y:auto}
.sheet{width:min(680px,100%);background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:0 8px 0 var(--ink);padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100% - 8px);overflow-y:auto;animation:pop .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.9) translateY(20px);opacity:0}}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:end}
.hero img{width:clamp(96px,22vw,150px);height:auto;display:block}
.hero .say{background:#fff3c4;border:2.5px solid var(--ink);border-radius:16px;padding:10px 14px;align-self:center}
.hero .say h2{font-size:clamp(22px,4vw,30px)}
.name-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.name-row label{font-family:var(--display);font-size:18px}
.name-row input{flex:1;min-width:0;font:inherit;font-size:18px;padding:8px 12px;border:2.5px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.how div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14.5px;line-height:1.4}
.how b{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stat{background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 4px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--ink-soft)}
.fav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fav button,.styles button{border:2px solid var(--ink);border-radius:12px;background:#fff;padding:8px 6px;font-size:15px;min-width:0}
.fav button[aria-pressed="true"],.styles button[aria-pressed="true"]{background:var(--hoodie)}
.styles{display:flex;flex-wrap:wrap;gap:6px}
.worksheet{border:2.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.worksheet h3{font-size:17px;background:var(--ink);color:#fff;padding:6px 12px}
.ws-row{display:grid;grid-template-columns:92px 1fr;border-top:1.5px solid var(--line)}
.ws-row:first-of-type{border-top:0}
.ws-row span{background:#f1f5f2;padding:8px 10px;font-size:14px;color:var(--ink-soft)}
.ws-row div{padding:8px 12px;font-size:16px;min-width:0}
.prompt{background:#fff6d6;border:2px solid var(--hoodie-deep);border-radius:12px;padding:10px 12px;font-size:17px;user-select:all}
@media (max-width:560px){.how{grid-template-columns:1fr}.fav{grid-template-columns:repeat(2,1fr)}.stat b{font-size:22px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div>
      <div class="eyebrow">생성형 AI 환경 프로젝트 · 1교시 환경 게임</div>
      <h1>신동읍 <em>환경 구조대</em></h1>
    </div>
    <div class="status">
      <div class="gauge">
        <div class="gauge-label"><span>마을 환경 점수 · <span id="prog">0/6</span></span><b id="score">0</b></div>
        <div class="gauge-track"><div class="gauge-fill" id="fill"></div></div>
      </div>
      <div class="tools">
        <button class="chip-btn" id="soundBtn" type="button" aria-pressed="false">소리 끔</button>
        <button class="chip-btn" id="resetBtn" type="button">처음부터</button>
      </div>
    </div>
  </header>

  <nav class="mbar" id="mbar" aria-label="임무 장소로 바로 가기"></nav>

  <div class="stage" id="stage">
    <svg id="game" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="동이가 걸어 다니는 신동읍 마을. 화면을 누르면 동이가 그곳으로 걸어갑니다.">
      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7cc3e0"/><stop offset="1" stop-color="#e3f4f6"/></linearGradient>
        <linearGradient id="gDirty" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a39c88"/><stop offset="1" stop-color="#d8cdb2"/></linearGradient>
      </defs>
      <g id="screen">
        <rect id="skyD" width="800" height="450" fill="url(#gDirty)"/>
        <rect id="skyC" class="clean-sky t-slow" width="800" height="450" fill="url(#gSky)"/>
        <circle id="sun" cx="640" cy="160" r="30" fill="#ffd35a"/>
      </g>
      <g id="L1"></g>
      <g id="L2"></g>
      <g id="hazeG"><rect class="haze t-slow" id="haze" y="0" width="800" height="330" fill="#b8ab8c" opacity=".36"/></g>
      <g id="W"></g>
    </svg>
    <div class="banner" id="banner" hidden></div>
    <button class="btn sm ghost skip" id="skipBtn" type="button" hidden>건너뛰기</button>
  </div>

  <section class="panel" id="panel" aria-live="polite"></section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></div>
</div>

let ac = null;
function tone(kind){
  if (!S.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === 'good' ? [660, 880] : kind === 'win' ? [523, 659, 784, 1047] : kind === 'step' ? [440] : [220, 180];
    seq.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .09;
      o.type = kind === 'bad' ? 'square' : 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.14, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + .2);

  }catch(e){}
}

    <g data-bike="0" fill="none" stroke="#213a38" stroke-width="2"><circle cx="0" cy="336" r="7"/><circle cx="24" cy="336" r="7"/><path d="M0 336 L10 324 L24 336 M10 324 L18 324"/><circle cx="12" cy="310" r="4" fill="#e0782f"/><path d="M12 314 L12 326"/></g>`;

function renderRiverTrash(){
  const T = ['🥤','🧴','🛍️','🥫','👟','📦','🥡','🧴'];
  $('#rtrash').innerHTML = T.map((e, i) => { const x = 1350 + i * 44 + (i % 2) * 10, y = 408 + (i * 17 % 34);
    return `<g class="w-trash tap" data-trash="${i}" data-x="${x}"><circle cx="${x + 11}" cy="${y - 8}" r="20" fill="transparent"/><text class="bob" x="${x}" y="${y}" font-size="24">${e}</text></g>`; }).join('');
}

/* ---------------- village state ---------------- */
function renderVillage(){
  const g = $('#game');
  MISSIONS.forEach(m => g.classList.toggle('fix-' + m.id, m.id in S.done));
  g.style.filter = `saturate(${(.55 + nDone() * .09).toFixed(2)})`;
  const k = nDone() / 6;
  $('#grass').setAttribute('fill', mix('#9d9a6c', '#8cbf5f', k));
  $('#front').setAttribute('fill', mix('#a3a06d', '#8fc265', k));
  $('#score').textContent = total();
  $('#fill').style.width = total() + '%';
  $('#prog').textContent = `${nDone()}/6 해결`;
  $('#marks').innerHTML = MISSIONS.filter(m => !(m.id in S.done)).map(m =>
    `<g class="mark" data-go="${m.id}" transform="translate(${m.id === 'river' ? 1520 : m.x} ${m.my || 205})"><circle class="ring" r="18" fill="none" stroke="#f2c928" stroke-width="4"/><circle r="18" fill="#f2c928" stroke="#213a38" stroke-width="3"/><text y="1" fill="#213a38">!</text></g>`).join('');
  $('#mbar').innerHTML = MISSIONS.map(m => `<button type="button" data-go="${m.id}" class="${m.id in S.done ? 'done' : ''}"><span class="b">${m.id in S.done ? '✓' : '!'}</span>${m.t}</button>`).join('');
  R.panelKey = '';
}
function mix(a, b, k){
  const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const A = p(a), B = p(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join('');
}

/* ---------------- 동이 ---------------- */
function setPose(p){
  if (R.pose === p && $('#dongImg').getAttribute('href')) return;
  R.pose = p;
  const s = SPR[p], h = DONG_H, w = s.w / s.h * h;
  const img = $('#dongImg');
  img.setAttribute('href', s.uri); img.setAttribute('width', w.toFixed(1)); img.setAttribute('height', h);
  img.setAttribute('x', (-w / 2).toFixed(1)); img.setAttribute('y', FEET - h);
}
let emoteTimer = 0;
function emote(txt, ms){
  const tx = $('#emoteTx'), bg = $('#emoteBg');
  tx.textContent = txt;
  const w = Math.max(40, txt.length * 17 + 18);
  bg.setAttribute('width', w); bg.setAttribute('x', -w / 2); bg.setAttribute('y', FEET - DONG_H - 40);
  tx.setAttribute('x', 0); tx.setAttribute('y', FEET - DONG_H - 25);
  $('#emote').setAttribute('opacity', 1);
  clearTimeout(emoteTimer); emoteTimer = setTimeout(() => $('#emote').setAttribute('opacity', 0), ms || 1300);
}
function walkTo(x, then){ R.queue.push({ x:clamp(x, 40, WORLD - 40), then }); }
function stopWalking(){ R.queue = []; R.hold = 0; }

/* ---------------- effects ---------------- */
function fly(txt, x1, y1, x2, y2, dur, size){
  const el = document.createElementNS(NS, 'text');
  el.textContent = txt; el.setAttribute('font-size', size || 24); el.setAttribute('text-anchor', 'middle');
  $('#fx').appendChild(el);
  R.fx.push({ el, x1, y1, x2, y2, t0:performance.now(), dur:dur || 600, arc:60 });
}
function floatText(txt, x, y, color){
  const el = document.createElementNS(NS, 'text');
  el.textContent = txt; el.setAttribute('font-size', 22); el.setAttribute('text-anchor', 'middle'); el.setAttribute('fill', color || '#4f8a3c');
  el.setAttribute('stroke', '#fff'); el.setAttribute('stroke-width', 4); el.setAttribute('paint-order', 'stroke');
  $('#fx').appendChild(el);
  R.fx.push({ el, x1:x, y1:y, x2:x, y2:y - 50, t0:performance.now(), dur:900, arc:0, fade:true });
}
function sparkle(x, y){ for (let i = 0; i < 5; i++){ const a = i / 5 * Math.PI * 2; fly('✨', x, y, x + Math.cos(a) * 46, y + Math.sin(a) * 34, 700, 16); } }

/* ---------------- panel ---------------- */
function face(f){ R.face = f; }
function panel(title, text, body, key){
  if (key && key === R.panelKey) return;
  R.panelKey = key || Math.random();
  const s = SPR[R.face];
  $('#panel').innerHTML = `<div class="talk"><div class="face pop"><img alt="동이 ${R.face === 'happy' ? '웃는' : R.face === 'worried' ? '걱정하는' : '씩씩한'} 얼굴" src="${s.uri}"></div>
    <div class="say"><div class="who">동이</div>${title ? `<h2>${title}</h2>` : ''}<p id="sayText">${text}</p></div></div>
    <div class="body" id="pbody">${body || ''}</div>`;
}
function say(text, f){
  if (f && f !== R.face){ R.face = f; const im = $('#panel .face img'); if (im){ im.src = SPR[f].uri; const fc = $('#panel .face'); fc.classList.remove('pop'); void fc.offsetWidth; fc.classList.add('pop'); } }
  const e = $('#sayText'); if (e) e.innerHTML = text;
}
const padHTML = extra => `<div class="row"><div class="pad"><button type="button" data-hold="-1" aria-label="왼쪽으로 걷기">◀</button><button type="button" data-hold="1" aria-label="오른쪽으로 걷기">▶</button></div>${extra || ''}</div>`;

function nearStation(){
  let best = null;
  MISSIONS.forEach(m => { const d = Math.abs(R.x - m.x); if (d < 130 && (!best || d < best.d)) best = { m, d }; });
  return best && best.m;
}
function updateFreePanel(){
  if (R.mode !== 'free') return;
  const m = nearStation();
  if (m && !(m.id in S.done)){
    if (R.panelKey === 'offer-' + m.id) return;
    face('worried');
    const ph = PHOTO[m.id] ? `<figure class="photo"><img src="${PHOTO[m.id]}" alt="${PHOTO_CAP[m.id]} 사진"><figcaption>${PHOTO_CAP[m.id]}</figcaption></figure>` : '';
    panel(m.t, m.offer, `<div class="offer">${ph}<div class="offer-act">${padHTML()}<button class="btn" type="button" data-start="${m.id}">동이 도와주기!</button></div></div>`, 'offer-' + m.id);
  } else if (m){
    if (R.panelKey === 'solved-' + m.id) return;
    face('happy');
    panel(m.t, `여긴 벌써 깨끗해졌어! ${m.done}`, padHTML(), 'solved-' + m.id);
  } else {
    const left = 6 - nDone();
    const key = 'free-' + left;
    if (R.panelKey === key) return;
    face(left ? 'determined' : 'happy');
    panel(left ? `남은 임무 ${left}개!` : '신동읍이 모두 바뀌었어!',
      left ? '화면을 누르면 내가 그쪽으로 걸어갈게. 위의 임무 버튼을 누르면 바로 달려가!' : '고마워! 마을을 둘러보자.',
      padHTML(), key);
  }
}

/* ---------------- missions ---------------- */
function startMission(id){
  const m = MID[id];
  stopWalking();
  R.mode = 'mission'; R.mission = { id, mistakes:0, cleanup:null, locked:false };
  R.camTarget = m.x;
  face('determined');
  panel(m.t, m.play, '', 'm-' + id);
  $('#pbody').innerHTML = `<div id="mstage" class="body"></div><div class="row"><span class="muted" id="mist">실수 0번</span><button class="btn ghost sm" type="button" data-quit>나중에 하기</button></div>`;
  GAMES[id]();
  emote('해 보자!', 1000);
}
function miss(msg){
  const M = R.mission; M.mistakes++;
  $('#mist').textContent = `실수 ${M.mistakes}번`;
  tone('bad'); say(msg, 'worried'); emote('앗!', 900);
  const p = $('#panel'); p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
}
function good(msg){ tone('good'); if (msg) say(msg, 'happy'); }
function quitMission(){
  const M = R.mission; if (!M) return;
  if (M.cleanup) M.cleanup();
  R.mode = 'free'; R.mission = null; R.camTarget = null; stopWalking(); R.panelKey = '';
  renderVillage(); updateFreePanel();
}
function finishMission(){
  const M = R.mission, m = MID[M.id];
  const pts = Math.max(8, MAX_PER - M.mistakes * 2);
  S.done[M.id] = pts;
  if (nDone() === MISSIONS.length && !S.t1) S.t1 = Date.now();
  save(); tone('win');
  R.mission = null; stopWalking();
  renderVillage();
  sparkle(R.x, FEET - DONG_H / 2); floatText(`+${pts}`, R.x, FEET - DONG_H - 10, '#b98a00');
  setPose('front'); R.celebrate = performance.now();
  face('happy');
  panel(`+${pts}점! ${m.t} 성공`, `${m.done} ${M.mistakes === 0 ? '실수 하나 없이 완벽했어!' : `실수 ${M.mistakes}번, 그래도 해냈어!`}`,
    `<div class="row"><span class="muted">화면에서 바뀐 마을을 확인해 봐!</span><button class="btn" type="button" data-cont>${nDone() === 6 ? '10년 뒤 신동읍 보기' : '다음 장소로!'}</button></div>`, 'fin-' + M.id);
  R.mode = 'result';
  const b = $('[data-cont]'); if (b) b.focus({ preventScroll:true });
}

const GAMES = {
  trash(){
    const BINS = [['plastic','플라스틱','#9fd3e6',0],['paper','종이','#f7dc8a',1],['can','캔·고철','#c9cfd4',2],['vinyl','비닐','#b9e0a8',3]];
    const ITEMS = shuffle([
      { e:'🧴', n:'다 쓴 샴푸 통', h:'내용물을 비우고 헹궈서', b:'plastic' },
      { e:'🥤', n:'일회용 플라스틱 컵', h:'빨대는 빼고 헹궈서', b:'plastic' },
      { e:'📰', n:'신문지', h:'물에 젖지 않게 모아서', b:'paper' },
      { e:'📦', n:'택배 상자', h:'테이프와 송장을 떼고 펴서', b:'paper' },
      { e:'🥫', n:'통조림 캔', h:'안을 헹구고 찌그러뜨려서', b:'can' },
      { e:'🛍️', n:'비닐봉지', h:'음식물이 묻었으면 씻어서', b:'vinyl' },
    ]);

    const show = () => { const it = ITEMS[i]; $('#item').innerHTML = `<span class="e">${it.e}</span><span><span class="n">${it.n}</span> <span class="counter">(${i + 1}/${ITEMS.length})</span><br><span class="h">버릴 때: ${it.h}</span></span>`; emote(it.e, 2500); };
    show();
    const pile = $('#pile');
    R.mission.onBin = (b, bi) => {
      if (i >= ITEMS.length) return;
      const it = ITEMS[i];
      if (b === it.b){
        fly(it.e, R.x + 10, FEET - 80, 685 + bi * 34, 332, 650, 22);
        i++; good(`딩동! ${it.n}은(는) ${BINS[bi][1]} 통!`);
        pile.style.transform = `scale(${(1 - i / ITEMS.length * .85).toFixed(2)})`;
        if (i === ITEMS.length) setTimeout(finishMission, 700); else show();
      } else miss(`음… ${it.n}은(는) ${BINS[bi][1]} 통이 아니야. 다시 골라 줘!`);
    };
    R.mission.cleanup = () => { pile.style.transform = ''; };
  },

  forest(){
    const MX = MID.forest.mx; let left = MX.length; const planted = new Set();
    walkTo(MX[0] - 30);
    $('#mstage').innerHTML = `<div class="counter" id="cnt">심을 나무 ${left}그루</div><p class="muted" style="margin:0">흙더미(갈색 동그라미)를 누르면 동이가 달려가서 심어요.</p>`;
    MX.forEach((x, i) => { const g = $('#mound' + i); g.insertAdjacentHTML('beforeend', `<circle class="tap-hint" cx="${x}" cy="350" r="16" fill="none" stroke="#f2c928" stroke-width="3"/>`); });
    R.mission.onMound = i => {
      if (planted.has(i)) return; planted.add(i);
      const x = MX[i];
      walkTo(x - 34, () => {
        R.dir = 1; setPose('side'); emote('영차!', 700);
        const m = $('#mound' + i); m.style.opacity = 0;
        const t = $('#mtree' + i); t.classList.add('on', 'grow');
        sparkle(x, 320); left--;
        $('#cnt').textContent = left ? `심을 나무 ${left}그루` : '다 심었어!';
        good(left ? `쑥쑥 자란다! ${left}그루 남았어.` : '');
        if (!left) setTimeout(finishMission, 800);
      });
    };
    R.mission.cleanup = () => MX.forEach((x, i) => { $('#mound' + i).style.opacity = ''; $('#mound' + i).querySelector('.tap-hint')?.remove(); $('#mtree' + i).classList.remove('on', 'grow'); });
  },

  river(){
    renderRiverTrash();
    let left = 8; const got = new Set();
    walkTo(1450);
    $('#mstage').innerHTML = `<div class="counter" id="cnt">남은 쓰레기 ${left}개</div>`;
    R.mission.onTrash = (i, el) => {
      if (got.has(i)) return; got.add(i);
      const x = +el.dataset.x, txt = el.querySelector('text').textContent;
      walkTo(clamp(x + 10, 1340, 1690), () => {
        setPose('front');
        fly(txt, x + 10, 412, R.x, FEET - 70, 450, 24);
        el.remove(); left--;
        emote(left ? '건졌다!' : '다 건졌다!', 700);
        $('#cnt').textContent = `남은 쓰레기 ${left}개`;
        document.querySelectorAll('.water').forEach(el => el.setAttribute('fill', mix('#8a7a55', '#4aa3c9', 1 - left / 8)));
        good(left > 3 ? '좋아! 계속 눌러 줘.' : left ? '거의 다 왔어!' : '');
        if (!left) setTimeout(finishMission, 800);
      });
    };
    R.mission.onFish = () => miss('앗, 그건 물고기야! 물고기는 살려 줘!');
    R.mission.cleanup = () => { renderRiverTrash(); document.querySelectorAll('.water').forEach(el => el.setAttribute('fill', '#8a7a55')); };
  },

  energy(){
    const ROOFS = ['1', '2', '3', '4']; let left = 4; const on = new Set();

    $('#mstage').innerHTML = `<div class="counter" id="cnt">1단계 · 지붕 4곳을 눌러 태양광 패널 달기 (${left}곳 남음)</div><div id="step2"></div>`;
    R.mission.onRoof = (i, x) => {
      if (!ROOFS.includes(i) || on.has(i) || left === 0) return; on.add(i);
      walkTo(x, () => {
        setPose('back'); emote('설치 완료!', 800);
        $('#solar' + i).classList.add('on'); sparkle(x + 10, 250); left--;
        $('#cnt').textContent = left ? `1단계 · 지붕을 눌러 태양광 패널 달기 (${left}곳 남음)` : '2단계 · 전기를 아끼는 좋은 습관 카드 3장 고르기';
        good(left ? '패널 하나 설치!' : '햇빛 발전 준비 끝! 이제 우리 가족 습관도 바꿔 보자. 좋은 습관 3개를 골라 줘.');
        if (!left) habits();
      });
    };
    function habits(){
      const C = shuffle([
        { t:'쓰지 않는 전자제품 플러그 뽑기', g:1 }, { t:'아무도 없는 교실 불 끄기', g:1 }, { t:'여름 에어컨 온도를 26℃ 정도로 맞추기', g:1 },
        { t:'냉장고 문 열어 놓고 뭐 먹을지 고민하기', g:0 }, { t:'아무도 안 보는 TV 켜 두기', g:0 }, { t:'창문 열어 둔 채 난방 틀기', g:0 },
      ]);
      let need = 3;
      $('#step2').innerHTML = `<div class="cards">${C.map(c => `<button type="button" class="card-pick" data-habit="${c.g}">${c.t}</button>`).join('')}</div>`;
      R.mission.onHabit = b => {
        if (b.classList.contains('ok') || b.classList.contains('no')) return;
        if (b.dataset.habit === '1'){ b.classList.add('ok'); need--; emote('좋아!', 700); good(need ? `좋은 습관! ${need}장 더.` : ''); if (!need) setTimeout(finishMission, 600); }
        else { b.classList.add('no'); miss('그건 전기를 낭비하는 습관이야!'); }
      };
    }
    R.mission.cleanup = () => ROOFS.forEach(i => $('#solar' + i).classList.remove('on'));
  },

  air(){
    const QS = [
      { q:'마당에서 쓰레기를 태우면 금방 없어지니까 괜찮다.', a:false, why:'쓰레기를 태우면 몸에 해로운 연기와 물질이 나와요. 쓰레기를 함부로 태우는 것은 법으로 금지되어 있어요.' },
      { q:'밭에서 쓰고 남은 폐비닐을 태우는 것도 공기를 더럽힌다.', a:true, why:'비닐을 태우면 검은 연기와 유해가스가 나와요. 폐비닐은 모아서 수거 장소에 내놓아야 해요.' },
      { q:'나무와 숲은 공기를 맑게 하는 데 도움을 준다.', a:true, why:'나무는 이산화탄소를 흡수하고 산소를 내보내요. 잎은 먼지를 붙잡아 주기도 해요.' },
    ];
    let i = 0, right = 0;
    walkTo(2530);
    const ms = $('#mstage');
    const show = () => {
      ms.innerHTML = `<div class="counter">${i + 1} / ${QS.length}</div><div class="q">${QS[i].q}</div>
        <div class="ox"><button type="button" class="o" data-ox="1" aria-label="O 맞다">O</button><button type="button" class="x" data-ox="0" aria-label="X 아니다">X</button></div><div id="ex"></div>`;
      R.mission.locked = false;
    };
    show();
    R.mission.onOX = v => {
      if (R.mission.locked) return; R.mission.locked = true;
      const q = QS[i], ok = (v === '1') === q.a;
      if (ok){ right++; good('정답이야! 연기가 줄어들었어.'); emote('정답!', 800); $('#smoke').style.opacity = 1 - (i + 1) / QS.length * .8; }
      else miss('아쉽다! 설명을 읽어 봐.');
      $('#ex').innerHTML = `<div class="explain${ok ? '' : ' bad'}"><b>정답: ${q.a ? 'O' : 'X'}</b> · ${q.why}</div>
        <div class="row" style="margin-top:8px"><span></span><button type="button" class="btn sm" data-next>${i === QS.length - 1 ? '연기 걷어 내기' : '다음 문제'}</button></div>`;
      $('[data-next]').focus({ preventScroll:true });
    };
    R.mission.onNext = () => { i++; if (i === QS.length){ $('#smoke').style.opacity = ''; finishMission(); } else show(); };
    R.mission.cleanup = () => { $('#smoke').style.opacity = ''; };
  },

  traffic(){
    const QS = shuffle([
      { q:'걸어서 15분 거리인 친구 집에 놀러 갈 때', a:'걷거나 자전거 타기', b:'부모님께 차로 태워 달라고 하기', why:'가까운 거리는 걷거나 자전거를 타면 매연이 전혀 나오지 않고 운동도 돼요.' },
      { q:'친구 네 명이 같은 곳에 갈 때', a:'다 같이 버스 타기', b:'각자 부모님 차 타고 가기', why:'버스 한 대에 함께 타면 자동차 여러 대가 다닐 때보다 매연이 훨씬 줄어요.' },
      { q:'차 안에서 잠깐 누구를 기다릴 때', a:'시동을 끄고 기다리기', b:'시동을 켜 둔 채 기다리기', why:'서 있는 차의 시동을 켜 두는 것을 공회전이라고 해요. 기름만 쓰고 매연을 내뿜어요.' },
    ]);
    let i = 0;
    walkTo(2830);
    const ms = $('#mstage');
    const show = () => {
      const q = QS[i], opts = shuffle([[q.a, 1], [q.b, 0]]);
      ms.innerHTML = `<div class="counter">${i + 1} / ${QS.length}</div><div class="q">${q.q}, 어떻게 할까?</div>
        <div class="choices">${opts.map(o => `<button type="button" data-ch="${o[1]}">${o[0]}</button>`).join('')}</div><div id="ex"></div>`;
      R.mission.locked = false;
    };
    show();
    R.mission.onChoice = v => {
      if (R.mission.locked) return; R.mission.locked = true;
      const ok = v === '1', q = QS[i];
      ok ? (good('맞아, 그게 친환경 선택이야!'), emote('좋아!', 800)) : miss('다른 쪽이 더 좋은 선택이야.');
      $('#ex').innerHTML = `<div class="explain${ok ? '' : ' bad'}"><b>${q.a}</b> · ${q.why}</div>
        <div class="row" style="margin-top:8px"><span></span><button type="button" class="btn sm" data-next>${i === QS.length - 1 ? '초록 버스 부르기' : '다음 상황'}</button></div>`;
      $('[data-next]').focus({ preventScroll:true });
    };
    R.mission.onNext = () => { i++; if (i === QS.length) finishMission(); else show(); };
  },
};

/* ---------------- tour + ending ---------------- */
function startTour(){
  R.mode = 'tour'; stopWalking();
  const maxCam = WORLD - R.VW;
  R.tour = { t0:performance.now(), from:R.cam, dur:Math.max(5000, maxCam * 3.2) };
  $('#banner').textContent = '10년 뒤 신동읍'; $('#banner').hidden = false; $('#skipBtn').hidden = false;
  face('happy');
  panel('우와, 우리 마을 좀 봐!', '하천도, 하늘도, 산도 모두 살아났어. 마을을 한 바퀴 둘러보자!', '', 'tour');
}
function endTour(){
  if (R.mode !== 'tour') return;
  R.tour = null; R.mode = 'free'; $('#banner').hidden = true; $('#skipBtn').hidden = true;
  R.cam = clamp(R.x - R.VW / 2, 0, WORLD - R.VW);
  R.panelKey = ''; updateFreePanel();
  showEnding();
}
function fmt(ms){ const s = Math.max(0, Math.round(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }

let lastFocus = null;
function openSheet(html){ lastFocus = document.activeElement; $('#sheet').innerHTML = html; $('#overlay').hidden = false; const f = $('#sheet').querySelector('[autofocus], input, button'); if (f) f.focus({ preventScroll:true }); }
function closeSheet(){ $('#overlay').hidden = true; $('#sheet').innerHTML = ''; if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll:true }); }

function showIntro(){
  openSheet(`<div class="hero"><img src="${SPR.wave.uri}" alt="손을 흔드는 동이">
      <div class="say"><h2 id="sheetTitle">안녕! 나는 신동읍 환경 지킴이 동이야</h2>
      <p>안경다리 아래 하천엔 쓰레기가 떠다니고, 하늘은 연기로 뿌옇고, 뒷산은 나무가 베어져 휑해. 나랑 같이 마을을 돌면서 <b>6가지 임무</b>를 해결해 줄래?</p></div></div>
    <div class="how"><div><b>걷기</b>화면을 누르면 동이가 그곳으로 걸어가요. ◀ ▶ 버튼도 돼요.</div><div><b>임무</b>노란 ! 표시가 있는 곳에서 동이를 도와주세요.</div><div><b>점수</b>임무마다 최고 16점, 실수하면 2점씩 줄어요.</div></div>
    <div class="name-row"><label for="nameIn">구조대원 이름</label><input id="nameIn" maxlength="10" autocomplete="off" placeholder="이름을 적어 주세요" value="${esc(S.name)}"></div>
    <div class="row"><span></span><button class="btn" type="button" id="goBtn">동이랑 출발!</button></div>`);
  const go = () => {
    S.name = ($('#nameIn').value || '').trim().slice(0, 10);
    S.started = true; S.t0 = S.t0 || Date.now(); save();
    closeSheet(); tone('good'); emote(S.name ? `${S.name}, 가자!` : '가자!', 1600);
    R.panelKey = ''; updateFreePanel();
  };
  $('#goBtn').addEventListener('click', go);
  $('#nameIn').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
}

function showEnding(){
  const sc = total();
  const rank = sc >= 95 ? '구조대 대장' : sc >= 80 ? '에이스 대원' : '든든한 대원';
  const who = S.name ? `${esc(S.name)} 대원` : '구조대원';
  openSheet(`<div class="hero"><img src="${SPR.wave.uri}" alt="손을 흔드는 동이">
      <div class="say"><h2 id="sheetTitle">${who}, 고마워!</h2><p>덕분에 신동읍이 완전히 바뀌었어. 이제 <b>가장 마음에 든 변화 1가지</b>를 골라서 활동지에 옮겨 적어 보자.</p></div></div>
    <div class="stats"><div class="stat"><b>${sc}</b><span>마을 환경 점수</span></div><div class="stat"><b>${fmt((S.t1 || Date.now()) - S.t0)}</b><span>걸린 시간</span></div><div class="stat"><b style="font-size:21px;line-height:1.6">${rank}</b><span>나의 등급</span></div></div>
    <div class="fav" id="fav">${MISSIONS.map(m => `<button type="button" data-fav="${m.id}" aria-pressed="${S.fav === m.id}">${m.t}</button>`).join('')}</div>
    <div id="wsOut" class="body"></div>
    <div class="row"><button class="btn ghost" type="button" data-closesheet>마을 다시 둘러보기</button></div>`);
  drawWS();
}
function drawWS(){
  const out = $('#wsOut'); if (!out) return;
  const m = MID[S.fav];
  if (!m){ out.innerHTML = '<p class="muted" style="margin:0">위에서 하나를 누르면 활동지에 쓸 문장이 나와요.</p>'; return; }
  const prompt = `${m.ws.where}, ${m.ws.how} 모습, ${STYLES[S.style]}`;
  out.innerHTML = `
    <div class="worksheet"><h3>활동지 1번 · 게임에서 찾은 우리 동네 문제</h3>
      <div class="ws-row"><span>바꾸고 싶은 것</span><div>${m.ws.change}</div></div>
      <div class="ws-row"><span>바뀌면 좋은 점</span><div>${m.ws.good}</div></div></div>
    <div class="worksheet"><h3>활동지 2번 · 그림 만들기</h3>
      <div class="ws-row"><span>어디를</span><div>${m.ws.where}</div></div>
      <div class="ws-row"><span>어떻게</span><div>${m.ws.how}</div></div>
      <div class="ws-row"><span>어떤 느낌</span><div class="styles">${STYLES.map((s, i) => `<button type="button" data-style="${i}" aria-pressed="${i === S.style}">${s}</button>`).join('')}</div></div></div>
    <div><p class="muted" style="margin:0 0 4px">세 칸을 이으면 그림 만드는 문장이 돼요. 내 생각대로 바꿔 써도 좋아요!</p><div class="prompt" id="promptTxt">${prompt}</div></div>
    <div class="row"><span class="muted" id="copyMsg"></span><button class="btn" type="button" id="copyBtn">문장 복사하기</button></div>`;
}
function selectText(){ const r = document.createRange(); r.selectNodeContents($('#promptTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }

/* ---------------- input ---------------- */
function worldX(clientX){ const r = $('#game').getBoundingClientRect(); return (clientX - r.left) / r.width * R.VW + R.cam; }
$('#game').addEventListener('pointerdown', e => {
  if (!S.started || R.mode === 'tour' || !$('#overlay').hidden) return;
  const t = e.target;
  const go = t.closest('[data-go]');
  if (go && R.mode === 'free'){ goStation(go.dataset.go); return; }
  const M = R.mission;
  if (M && R.mode === 'mission'){
    const tr = t.closest('[data-trash]'); if (tr && M.onTrash){ M.onTrash(+tr.dataset.trash, tr); return; }
    const fi = t.closest('[data-fish]'); if (fi && M.onFish){ M.onFish(); return; }
    const mo = t.closest('[data-mound]'); if (mo && M.onMound){ M.onMound(+mo.dataset.mound); return; }
    const ro = t.closest('[data-roof]'); if (ro && M.onRoof){ M.onRoof(ro.dataset.roof, +ro.dataset.x); return; }
    return;
  }
  if (R.mode !== 'free') return;
  const x = worldX(e.clientX);
  stopWalking(); walkTo(x);
  const ring = $('#tapRing');
  ring.innerHTML = `<ellipse class="tap-hint" cx="${x}" cy="${FEET}" rx="16" ry="6" fill="none" stroke="#f2c928" stroke-width="3"/>`;
  setTimeout(() => { ring.innerHTML = ''; }, 700);
});
function goStation(id){
  if (!S.started) return;
  if (R.mode === 'mission') quitMission();
  if (R.mode === 'result'){ R.mode = 'free'; }
  const m = MID[id]; stopWalking();
  walkTo(m.x - 40, () => { R.panelKey = ''; updateFreePanel(); });
  emote('달려가자!', 800);
}
document.addEventListener('click', e => {
  const t = e.target;
  const go = t.closest('#mbar [data-go]'); if (go){ goStation(go.dataset.go); return; }
  const st = t.closest('[data-start]'); if (st){ startMission(st.dataset.start); return; }
  if (t.closest('[data-quit]')){ quitMission(); return; }
  if (t.closest('[data-cont]')){ R.mode = 'free'; R.panelKey = ''; if (nDone() === 6) startTour(); else { const next = MISSIONS.find(m => !(m.id in S.done)); updateFreePanel(); if (next) emote(`다음은 ${next.sign}!`, 1500); } return; }
  const M = R.mission;
  if (M){
    const bin = t.closest('[data-bin]'); if (bin && M.onBin){ M.onBin(bin.dataset.bin, +bin.dataset.bi); return; }
    const ox = t.closest('[data-ox]'); if (ox && M.onOX){ M.onOX(ox.dataset.ox); return; }
    const ch = t.closest('[data-ch]'); if (ch && M.onChoice){ M.onChoice(ch.dataset.ch); return; }
    const hb = t.closest('[data-habit]'); if (hb && M.onHabit){ M.onHabit(hb); return; }
    if (t.closest('[data-next]') && M.onNext){ M.onNext(); return; }
  }
  const fv = t.closest('[data-fav]'); if (fv){ S.fav = fv.dataset.fav; save(); document.querySelectorAll('[data-fav]').forEach(b => b.setAttribute('aria-pressed', b === fv)); drawWS(); tone('good'); return; }
  const sy = t.closest('[data-style]'); if (sy){ S.style = +sy.dataset.style; save(); drawWS(); return; }
  if (t.id === 'copyBtn'){
    const txt = $('#promptTxt').textContent;
    const done = ok => { $('#copyMsg').textContent = ok ? '복사했어요! 이미지 AI 입력창에 붙여 넣으세요.' : '문장을 길게 눌러 직접 복사해 주세요.'; };
    try { navigator.clipboard.writeText(txt).then(() => done(true), () => { selectText(); done(false); }); } catch(err){ selectText(); done(false); }
    return;
  }
  if (t.closest('[data-closesheet]')){ closeSheet(); R.panelKey = ''; updateFreePanel(); return; }
});
document.addEventListener('pointerdown', e => { const h = e.target.closest('[data-hold]'); if (h && R.mode === 'free'){ e.preventDefault(); R.queue = []; R.hold = +h.dataset.hold; } });
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => document.addEventListener(ev, e => { if (e.type !== 'pointerleave' || e.target.closest?.('[data-hold]')) R.hold = 0; }));
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (R.mode === 'free' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ e.preventDefault(); R.queue = []; R.hold = e.key === 'ArrowLeft' ? -1 : 1; }
});
document.addEventListener('keyup', e => { if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') R.hold = 0; });
$('#skipBtn').addEventListener('click', endTour);

$('#soundBtn').addEventListener('click', () => { S.sound = !S.sound; save(); syncSound(); tone('good'); });
function syncSound(){ $('#soundBtn').textContent = S.sound ? '소리 켬' : '소리 끔'; $('#soundBtn').setAttribute('aria-pressed', S.sound); }
let resetArm = null;
$('#resetBtn').addEventListener('click', () => {
  const b = $('#resetBtn');
  if (!resetArm){ b.textContent = '한 번 더 누르면 초기화'; b.classList.add('warn'); resetArm = setTimeout(() => { resetArm = null; b.textContent = '처음부터'; b.classList.remove('warn'); }, 3000); return; }
  clearTimeout(resetArm); resetArm = null; b.textContent = '처음부터'; b.classList.remove('warn');
  if (R.mission && R.mission.cleanup) R.mission.cleanup();
  const snd = S.sound;
  S = { name:'', started:false, t0:0, t1:0, done:{}, fav:null, style:0, sound:snd }; save();
  Object.assign(R, { x:240, dir:1, mode:'free', mission:null, queue:[], hold:0, tour:null, camTarget:null });
  $('#banner').hidden = true; $('#skipBtn').hidden = true; closeSheet();
  renderRiverTrash(); renderVillage(); updateFreePanel(); showIntro();
});

/* ---------------- loop ---------------- */
function resize(){
  const r = $('#stage').getBoundingClientRect();
  R.VW = clamp(VIEW_H * r.width / r.height, 380, 1200);
  $('#game').setAttribute('viewBox', `0 ${450 - VIEW_H} ${R.VW.toFixed(1)} ${VIEW_H}`);
  ['#skyD', '#skyC', '#haze'].forEach(s => $(s).setAttribute('width', R.VW));
  $('#sun').setAttribute('cx', R.VW - 110);
}
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  // movement
  let moving = false;
  if (R.hold && R.mode === 'free'){ R.x = clamp(R.x + R.hold * SPEED * dt, 40, WORLD - 40); R.dir = R.hold; moving = true; }
  else if (R.queue.length){
    const q = R.queue[0], d = q.x - R.x;
    if (Math.abs(d) < 4){ R.x = q.x; R.queue.shift(); if (q.then) q.then(); }
    else { const step = Math.sign(d) * Math.min(Math.abs(d), SPEED * dt); R.x += step; R.dir = Math.sign(d); moving = true; }
  }
  if (moving){ R.walkT += dt; setPose('side'); }
  else if (R.pose === 'side') setPose('front');
  const bob = moving ? -Math.abs(Math.sin(R.walkT * 11)) * 5 : 0;
  const cel = R.celebrate && now - R.celebrate < 1200 ? -Math.abs(Math.sin((now - R.celebrate) / 1200 * Math.PI * 3)) * 22 : 0;
  const img = $('#dongImg');
  img.setAttribute('transform', `translate(0 ${(bob + cel).toFixed(1)})${R.pose === 'side' && R.dir > 0 ? ' scale(-1 1)' : ''}`);
  $('#dong').setAttribute('transform', `translate(${R.x.toFixed(1)} 0)`);
  $('#shadow').setAttribute('rx', (22 + (bob + cel) * .6).toFixed(1));

  // camera
  const maxCam = WORLD - R.VW;
  if (R.tour){
    const k = Math.min(1, (now - R.tour.t0) / R.tour.dur);
    R.cam = k < .25 ? R.tour.from * (1 - k / .25) : maxCam * ((k - .25) / .75);
    if (k >= 1) endTour();
  } else {
    const focus = R.camTarget != null ? (R.camTarget + R.x) / 2 : R.x;
    const want = clamp(focus - R.VW / 2, 0, maxCam);
    R.cam += (want - R.cam) * Math.min(1, dt * 5);
  }
  $('#W').setAttribute('transform', `translate(${(-R.cam).toFixed(1)} 0)`);
  $('#L1').setAttribute('transform', `translate(${(-R.cam * .3).toFixed(1)} 0)`);
  $('#L2').setAttribute('transform', `translate(${(-R.cam * .6).toFixed(1)} 0)`);

  // traffic
  const t = now / 1000;
  document.querySelectorAll('[data-car]').forEach((c, i) => { const x = ((t * 110 + i * 1000) % (WORLD + 200)) - 100; c.setAttribute('transform', `translate(${x.toFixed(0)} 0)`); });
  const bx = ((t * 70) % (WORLD + 300)) - 150;
  $('[data-bus="0"]').setAttribute('transform', `translate(${bx.toFixed(0)} 0)`);
  $('[data-bike="0"]').setAttribute('transform', `translate(${(((t * 60 + 1400) % (WORLD + 200)) - 100).toFixed(0)} 0)`);

  // fx
  R.fx = R.fx.filter(f => {
    const k = Math.min(1, (now - f.t0) / f.dur);
    const x = f.x1 + (f.x2 - f.x1) * k, y = f.y1 + (f.y2 - f.y1) * k - Math.sin(k * Math.PI) * f.arc;
    f.el.setAttribute('x', x.toFixed(1)); f.el.setAttribute('y', y.toFixed(1));
    f.el.setAttribute('opacity', f.fade ? (1 - k).toFixed(2) : (k > .85 ? ((1 - k) / .15).toFixed(2) : 1));
    if (k >= 1){ f.el.remove(); return false; }
    return true;
  });

  if (R.mode === 'free' && S.started && $('#overlay').hidden) updateFreePanel();
  requestAnimationFrame(frame);
}

/* ---------------- boot ---------------- */
function start(d){
  load(d);
  buildWorld(); renderRiverTrash();
  setPose('front'); syncSound();
  resize(); window.addEventListener('resize', resize);
  R.cam = 0;
  renderVillage();
  if (!S.started){ face('worried'); panel('신동읍에 문제가 생겼어!', '구조대원 이름을 적고 출발해 줘.', '', 'pre'); showIntro(); }
  else { updateFreePanel(); if (nDone() === 6) showEnding(); }
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
})();
</script>
