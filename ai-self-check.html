<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 활용 자가 진단 · 노인일자리 실무 활용 교육</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1D3969; --navy-2:#2E5496; --sky:#DAE5F2; --mist:#EEF2FB;
  --red:#B8111A; --ink:#1F2937; --sub:#5B6472; --line:#D6DEEA;
  --bg:#F7F8FB; --card:#FFFFFF; --on-navy:#FFFFFF;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#9DB8E6; --navy-2:#7FA0D8; --sky:#22324F; --mist:#1A2438;
    --red:#FF7A7F; --ink:#E7EBF2; --sub:#A7B0BE; --line:#2C3A55;
    --bg:#0F1624; --card:#161F31; --on-navy:#0F1624;
  }
}
:root[data-theme="dark"]{
  --navy:#9DB8E6; --navy-2:#7FA0D8; --sky:#22324F; --mist:#1A2438;
  --red:#FF7A7F; --ink:#E7EBF2; --sub:#A7B0BE; --line:#2C3A55;
  --bg:#0F1624; --card:#161F31; --on-navy:#0F1624;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--sub);margin-bottom:18px}
header b{color:var(--navy);font-weight:700}
.progress{height:8px;background:var(--sky);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;width:0;background:var(--navy);transition:width .3s ease}
h1{font-size:30px;line-height:1.3;margin:6px 0 14px;color:var(--navy);font-weight:700;letter-spacing:-0.02em}
h2{font-size:24px;line-height:1.4;margin:0 0 8px;font-weight:700;letter-spacing:-0.01em}
p{margin:0 0 14px}
.muted{color:var(--sub);font-size:16px}
.step-no{font-size:15px;color:var(--sub);margin-bottom:6px}
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0 8px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:19px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:15px 16px;cursor:pointer;min-height:60px}
.opt .mark{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--on-navy)}
.opt.multi .mark{border-radius:7px}
.opt[aria-pressed="true"]{border-color:var(--navy);background:var(--mist)}
.opt[aria-pressed="true"] .mark{background:var(--navy);border-color:var(--navy)}
.opt[aria-pressed="true"] .mark::after{content:"✓"}
.opt:focus-visible,.btn:focus-visible,.copy:focus-visible{outline:3px solid var(--navy-2);outline-offset:2px}
.nav{display:flex;gap:10px;margin-top:auto;padding-top:22px}
.btn{font:inherit;font-weight:700;font-size:19px;border-radius:14px;padding:16px 18px;cursor:pointer;border:2px solid var(--navy);min-height:60px}
.btn.primary{flex:1;background:var(--navy);color:var(--on-navy)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{font-size:15px;color:var(--sub);margin-top:4px}
.intro-list{list-style:none;padding:0;margin:20px 0;display:grid;gap:12px}
.intro-list li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.intro-list b{display:block;color:var(--navy)}
.safe{font-size:15px;color:var(--sub);border-left:4px solid var(--navy);padding:4px 0 4px 12px;margin:8px 0 0}
/* 결과 */
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.rung{border-radius:12px;padding:12px 6px;text-align:center;background:var(--mist);color:var(--sub);font-size:15px;border:2px solid transparent}
.rung b{display:block;font-size:19px}
.rung.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.level-name{font-size:44px;font-weight:700;color:var(--navy);line-height:1.15;margin:18px 0 4px;letter-spacing:-0.03em}
.score{font-size:16px;color:var(--sub)}
.section{margin-top:28px}
.section h3{font-size:20px;margin:0 0 12px;color:var(--navy)}
.bar{margin-bottom:12px}
.bar .row{display:flex;justify-content:space-between;font-size:16px}
.bar .track{height:12px;background:var(--sky);border-radius:99px;overflow:hidden;margin-top:4px}
.bar .fill{height:100%;background:var(--navy);border-radius:99px}
.bar.weak .fill{background:var(--red)}
.bar.weak .row span:last-child{color:var(--red);font-weight:700}
.focus{background:var(--card);border:2px solid var(--navy);border-radius:14px;padding:16px}
.focus li{margin-bottom:8px}
.focus ul{margin:0;padding-left:20px}
.prompt{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.prompt .title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.prompt .title b{font-size:18px}
.prompt pre{white-space:pre-wrap;word-break:keep-all;font:inherit;font-size:16px;line-height:1.65;margin:0;color:var(--ink)}
.copy{font:inherit;font-size:15px;font-weight:700;background:var(--mist);color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.rule{background:var(--navy);color:var(--on-navy);border-radius:14px;padding:16px;font-weight:700}
footer{margin-top:32px;font-size:13px;color:var(--sub);text-align:center}
@media (prefers-reduced-motion: reduce){.progress i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header><span><b>AI 활용 자가 진단</b></span><span>강사 정 경</span></header>
  <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  <main id="app" style="display:flex;flex-direction:column;flex:1"></main>
  <footer>한국AI평생교육협회 · 바스제로 컨설팅<br>생성형 AI를 통한 노인일자리 실무 활용 교육</footer>
</div>

<script>
const CAN = [
  {id:"c1", axis:"basic",  text:"AI에 로그인해서 질문하고 답을 받을 수 있다"},
  {id:"c2", axis:"prompt", text:"답이 마음에 안 들면 \"더 짧게\"처럼 이어서 고쳐 달라고 할 수 있다"},
  {id:"c3", axis:"prompt", text:"대상 · 말투 · 결과 형식을 넣어서 부탁할 수 있다"},
  {id:"c4", axis:"file",   text:"파일(PDF · 한글)을 올려 요약을 받아 본 적이 있다"},
  {id:"c5", axis:"safe",   text:"AI 답의 숫자 · 날짜 · 규정을 원문과 확인한다"},
  {id:"c6", axis:"safe",   text:"참여자 이름 · 연락처를 빼고 입력하는 방법을 안다"},
  {id:"c7", axis:"make",   text:"AI로 이미지나 발표자료를 만들어 본 적이 있다"},
  {id:"c8", axis:"file",   text:"나만의 챗봇(Gems · GPTs)을 만들어 본 적이 있다"}
];
const AXES = {basic:"기본 사용", prompt:"프롬프트", file:"자료 · 챗봇 활용", safe:"안전 · 검증", make:"콘텐츠 제작"};

const STEPS = [
  {key:"job", type:"multi", max:2, q:"주로 맡고 있는 업무는 무엇인가요?", hint:"2개까지 고를 수 있어요",
   opts:[["recruit","모집 · 선발"],["activity","활동 관리 · 활동일지"],["report","실적보고 · 계획서"],["contact","참여자 안내 · 문자"],["event","행사 · 홍보"]]},
  {key:"tools", type:"multi", q:"써 본 AI를 모두 골라 주세요", hint:"써 본 적이 없으면 첫 번째를 고르세요", none:"none",
   opts:[["none","아직 써 본 적 없음"],["chatgpt","ChatGPT"],["gemini","Gemini"],["claude","Claude"],["etc","그 밖의 AI (뤼튼 · 에이닷 · Copilot 등)"]]},
  {key:"freq", type:"single", q:"AI를 얼마나 자주 쓰나요?",
   opts:[[0,"거의 안 쓴다"],[1,"한 달에 몇 번"],[2,"일주일에 1~2번"],[3,"거의 매일"]]},
  {key:"work", type:"single", q:"업무 문서에 AI를 써 본 적이 있나요?",
   opts:[[0,"없다"],[1,"한두 번 해 봤다"],[2,"가끔 쓴다"],[3,"업무에 자주 쓴다"]]},
  {key:"can", type:"multi", q:"지금 할 수 있는 것을 모두 골라 주세요", hint:"솔직하게 고를수록 결과가 정확해요",
   opts:CAN.map(c=>[c.id,c.text])},
  {key:"want", type:"single", q:"오늘 가장 배우고 싶은 것은?",
   opts:[["notice","안내문 · 문자 빨리 쓰기"],["report","실적보고 · 보고서 정리"],["guide","사업지침에서 답 찾기"],["design","홍보 이미지 · 발표자료"],["safety","개인정보 걱정 없이 쓰기"]]}
];

const state = {step:-1, ans:{job:[],tools:[],can:[]}};
const app = document.getElementById("app");
const bar = document.getElementById("bar");

function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  app.innerHTML="";
  window.scrollTo(0,0);
  if(state.step<0) return renderIntro();
  if(state.step>=STEPS.length) return renderResult();
  bar.style.width = ((state.step)/STEPS.length*100)+"%";
  const s = STEPS[state.step];
  const cur = state.ans[s.key];
  const box = document.createElement("div");
  box.style.cssText="display:flex;flex-direction:column;flex:1";
  box.append(el(`<div class="step-no">${state.step+1} / ${STEPS.length}</div>`));
  box.append(el(`<h2>${esc(s.q)}</h2>`));
  if(s.hint) box.append(el(`<div class="hint">${esc(s.hint)}</div>`));
  const opts = document.createElement("div"); opts.className="opts"; opts.setAttribute("role", s.type==="multi"?"group":"radiogroup");
  s.opts.forEach(([v,label])=>{
    const on = s.type==="multi" ? cur.includes(v) : cur===v;
    const b = el(`<button type="button" class="opt ${s.type==="multi"?"multi":""}" aria-pressed="${on}"><span class="mark"></span><span>${esc(label)}</span></button>`);
    b.addEventListener("click",()=>{
      if(s.type==="single"){ state.ans[s.key]=v; render(); return; }
      let arr=[...state.ans[s.key]];
      if(arr.includes(v)) arr=arr.filter(x=>x!==v);
      else{
        if(s.none && v===s.none) arr=[v];
        else{ arr=arr.filter(x=>x!==s.none); if(s.max && arr.length>=s.max) arr.shift(); arr.push(v); }
      }
      state.ans[s.key]=arr; render();
    });
    opts.append(b);
  });
  box.append(opts);
  const answered = s.type==="multi" ? (s.key==="can" ? true : cur.length>0) : cur!==undefined;
  const nav = el(`<div class="nav"><button type="button" class="btn ghost">이전</button><button type="button" class="btn primary">${state.step===STEPS.length-1?"결과 보기":"다음"}</button></div>`);
  const [prev,next]=nav.querySelectorAll("button");
  prev.addEventListener("click",()=>{state.step--;render();});
  next.disabled=!answered;
  next.addEventListener("click",()=>{state.step++;render();});
  if(s.key==="can") box.append(el(`<div class="hint">해당하는 것이 없으면 그냥 다음을 누르세요</div>`));
  box.append(nav);
  app.append(box);
}

function renderIntro(){
  bar.style.width="0%";
  const box=el(`<div style="display:flex;flex-direction:column;flex:1">
    <h1>나는 AI를<br>얼마만큼 쓰고 있을까?</h1>
    <p>6개 질문에 답하면 내 활용 단계와 오늘 강의에서 집중할 부분, 내 업무에 바로 쓰는 프롬프트를 알려드려요.</p>
    <ul class="intro-list">
      <li><b>걸리는 시간</b>2~3분</li>
      <li><b>받는 것</b>활용 단계 · 영역별 점수 · 내 업무 프롬프트 3개</li>
      <li><b>정답은 없어요</b>지금 할 수 있는 만큼만 솔직하게 고르세요</li>
    </ul>
    <p class="safe">이름이나 연락처는 묻지 않아요. 응답은 이 화면에서만 계산되고 어디에도 저장되지 않습니다.</p>
    <div class="nav"><button type="button" class="btn primary">진단 시작하기</button></div>
  </div>`);
  box.querySelector("button").addEventListener("click",()=>{state.step=0;render();});
  app.append(box);
}

function compute(){
  const a=state.ans;
  const toolCount=a.tools.filter(t=>t!=="none").length;
  const can=a.can;
  const has=id=>can.includes(id)?1:0;
  const freq=a.freq||0, work=a.work||0;
  const total = Math.min(toolCount,3) + freq + work + can.length; // 최대 17
  const axes = {
    basic:  Math.round(((has("c1")*2 + Math.min(toolCount,2) + freq)/7)*100),
    prompt: Math.round(((has("c2")+has("c3")*2 + Math.min(work,1))/4)*100),
    file:   Math.round(((has("c4")*2+has("c8")*2)/4)*100),
    safe:   Math.round(((has("c5")+has("c6"))/2)*100),
    make:   Math.round((has("c7"))*100)
  };
  let level = total<=5 ? 0 : total<=11 ? 1 : 2;
  return {total,axes,level};
}

const LEVELS=[
  {name:"첫걸음 단계", short:"첫걸음", msg:"AI를 막 시작하는 단계예요. 오늘은 로그인하고 한 줄 부탁해 보는 것부터 차근차근 따라오시면 됩니다."},
  {name:"실무 적용 단계", short:"실무 적용", msg:"AI를 써 본 경험이 있어요. 오늘은 부탁하는 방법(프롬프트)을 다듬어 업무 문서에 바로 쓰는 데 집중하세요."},
  {name:"적극 활용 단계", short:"적극 활용", msg:"이미 업무에 AI를 쓰고 있어요. 오늘은 챗봇(Gems)과 자료 기반 질문으로 반복 업무를 줄이는 데 집중하세요."}
];

const FOCUS={
  basic:"1교시 로그인과 \"대화로 고치기\"를 천천히 따라 해 보세요",
  prompt:"1교시 실습① 프롬프트 4요소(상황 · 할 일 · 조건 · 결과형식)에 집중하세요",
  file:"2교시 Gems 챗봇과 Gemini Notebook(사업안내서 질문) 실습에 집중하세요",
  safe:"개인정보 규칙과 \"숫자 · 규정은 원문 확인\" 습관을 꼭 챙기세요",
  make:"3교시 홍보 이미지 · 발표자료 실습에서 한 장 완성해 보세요"
};
const WANT={
  notice:"안내문 · 문자 → 1교시 실습①",
  report:"실적보고 → 2교시 실습② 실적보고 비서 Gem",
  guide:"사업지침 찾기 → 2교시 실습③ Gemini Notebook",
  design:"홍보 이미지 · 발표자료 → 3교시 실습④ · ⑥",
  safety:"개인정보 → 1교시 오늘의 규칙 · 3교시 안전 체크리스트"
};

const TAIL="제가 준 자료에 없는 사실은 추가하지 마세요.";
const PROMPTS={
  recruit:[
    ["모집 안내문","나는 [기관명] 노인일자리 담당자입니다.\n[사업명] 참여자 모집 안내문을 작성해 주세요.\n대상 [ ], 기간 [ ], 신청 방법 [ ], 문의 [ ].\n70대 어르신이 읽기 쉽게 짧은 문장으로, 제목 + 항목 목록, A4 한 장 분량.\n"+TAIL],
    ["선발 결과 공지","[사업명] 참여자 선발 결과 공지문을 작성해 주세요.\n선발 인원 [ ]명, 발표 방법 [ ], 이의신청 기간 [ ].\n정중한 공공기관 문체로, 항목별로 정리해 주세요.\n"+TAIL],
    ["모집 문자","위 모집 안내 내용을 참여자에게 보낼 문자로 바꿔 주세요.\n정중한 · 친근한 · 짧은 3가지 버전, 각 80자 이내."]
  ],
  activity:[
    ["활동일지 정리","아래 활동 메모를 활동일지 형식(일시 · 장소 · 참여 인원 · 활동 내용 · 특이사항)으로 정리해 주세요.\n"+TAIL+"\n\n[활동 메모 붙여넣기 — 참여자 이름은 지우고]"],
    ["독려 문자","이번 주 활동에 참여하신 어르신께 보낼 감사 · 독려 문자를\n정중한 · 친근한 · 짧은 3가지 버전으로, 각 80자 이내로 써 주세요."],
    ["회의록 요약","아래 회의 내용을 핵심만 개조식으로 요약하고,\n\"결정사항\"과 \"해야 할 일(담당 · 기한)\"을 따로 나눠 주세요.\n"+TAIL+"\n\n[회의 메모 붙여넣기]"]
  ],
  report:[
    ["월간 실적 요약","나는 노인일자리 수행기관 담당자입니다.\n아래 활동 내용을 ① 활동개요 ② 참여현황 ③ 주요 활동내용 ④ 주요 결과 ⑤ 특이사항 형태의 월간 실적보고 초안으로 정리해 주세요.\n각 항목 2문장 이내, 공공기관 보고서 문체.\n"+TAIL],
    ["공문 초안","[수신 기관]에 보낼 [협조 요청 / 결과 보고] 공문 초안을 작성해 주세요.\n제목 · 관련 근거 · 본문 · 붙임 순서, 개조식으로.\n"+TAIL],
    ["사업계획서 목차","[사업명] 사업계획서 목차와 각 항목에 들어갈 핵심 내용을 한 줄씩 제안해 주세요.\n공공사업 계획서 형식, 표로 정리."]
  ],
  contact:[
    ["참여자 안내문","나는 노인일자리 수행기관 담당자입니다.\n참여자에게 보낼 [안내 주제] 안내문을 작성해 주세요.\n대상은 70대 참여자, 어려운 행정용어는 쓰지 말고 존댓말로.\n제목 + 안내 항목 목록, A4 한 장 분량.\n"+TAIL],
    ["안내 문자 3종","이 내용을 참여 어르신께 보낼 문자로 바꿔 주세요.\n정중한 · 친근한 · 짧은 3가지 버전, 각 80자 이내."],
    ["만족도 설문 문항","[프로그램명] 참여 어르신 만족도 설문 문항 8개를 5점 척도로,\n어르신이 이해하기 쉬운 짧은 문장으로 만들어 주세요."]
  ],
  event:[
    ["홍보 이미지","[장소]에서 60~70대 어르신들이 [활동]을 하는 모습.\n따뜻하고 활기찬 분위기, 부드러운 파스텔톤 일러스트.\n홍보용 가로형 이미지, 글자는 넣지 말 것."],
    ["프로그램 기획안","[참여자 수]명 대상 [주제] 프로그램 기획안을\n프로그램명 / 목적 / 대상 / 세부 내용([ ]회차) / 운영방법 / 준비물 / 기대효과 형태로 작성해 주세요.\n공공기관 기획안 문체, A4 한 장 분량."],
    ["행사 안내문","[행사명] 안내문을 작성해 주세요.\n일시 [ ], 장소 [ ], 준비물 [ ], 문의 [ ].\n어르신이 읽기 쉽게 큰 항목 위주로 정리해 주세요.\n"+TAIL]
  ]
};

function pickPrompts(jobs){
  const list=[];
  const j = jobs.length?jobs:["contact"];
  if(j.length===1) PROMPTS[j[0]].forEach(p=>list.push(p));
  else { list.push(PROMPTS[j[0]][0],PROMPTS[j[0]][1],PROMPTS[j[1]][0]); }
  return list;
}

function renderResult(){
  bar.style.width="100%";
  const r=compute(), L=LEVELS[r.level];
  const sorted=Object.entries(r.axes).sort((a,b)=>a[1]-b[1]);
  const weak=sorted.slice(0,2).map(x=>x[0]);
  const box=document.createElement("div");
  box.append(el(`<div class="step-no">내 진단 결과</div>`));
  box.append(el(`<div class="ladder">${LEVELS.map((l,i)=>`<div class="rung ${i===r.level?"on":""}"><b>${i+1}단계</b>${l.short}</div>`).join("")}</div>`));
  box.append(el(`<div class="level-name">${L.name}</div>`));
  box.append(el(`<div class="score">점수 ${r.total} / 17</div>`));
  box.append(el(`<p style="margin-top:12px">${L.msg}</p>`));

  const bars=document.createElement("div"); bars.className="section";
  bars.append(el(`<h3>영역별 점수</h3>`));
  Object.entries(AXES).forEach(([k,label])=>{
    const v=r.axes[k];
    bars.append(el(`<div class="bar ${weak.includes(k)?"weak":""}"><div class="row"><span>${label}</span><span>${weak.includes(k)?"보완 "+v:v}</span></div><div class="track"><div class="fill" style="width:${Math.max(v,3)}%"></div></div></div>`));
  });
  box.append(bars);

  const focus=document.createElement("div"); focus.className="section";
  focus.append(el(`<h3>오늘 강의에서 집중할 곳</h3>`));
  const items=weak.map(k=>`<li>${FOCUS[k]}</li>`);
  if(state.ans.want) items.push(`<li>배우고 싶은 것: ${WANT[state.ans.want]}</li>`);
  focus.append(el(`<div class="focus"><ul>${items.join("")}</ul></div>`));
  box.append(focus);

  const pr=document.createElement("div"); pr.className="section";
  pr.append(el(`<h3>내 업무에 바로 쓰는 프롬프트</h3>`));
  pr.append(el(`<p class="muted">[ ] 안만 바꿔서 ChatGPT나 Gemini에 붙여넣으세요.</p>`));
  pickPrompts(state.ans.job).forEach(([t,body])=>{
    const card=el(`<div class="prompt"><div class="title"><b>${esc(t)}</b><button type="button" class="copy">복사</button></div><pre>${esc(body)}</pre></div>`);
    const btn=card.querySelector(".copy");
    btn.addEventListener("click",async()=>{
      try{ await navigator.clipboard.writeText(body); btn.textContent="복사됨"; }
      catch(e){ const ta=document.createElement("textarea"); ta.value=body; document.body.append(ta); ta.select(); try{document.execCommand("copy"); btn.textContent="복사됨";}catch(_){btn.textContent="길게 눌러 복사";} ta.remove(); }
      setTimeout(()=>btn.textContent="복사",1800);
    });
    pr.append(card);
  });
  box.append(pr);

  const rule=el(`<div class="section"><div class="rule">참여 어르신의 이름 · 주민번호 · 연락처 · 건강정보는 어떤 AI에도 입력하지 않습니다.</div></div>`);
  box.append(rule);
  const nav=el(`<div class="nav"><button type="button" class="btn ghost">다시 하기</button></div>`);
  nav.querySelector("button").addEventListener("click",()=>{state.step=-1;state.ans={job:[],tools:[],can:[]};render();});
  box.append(nav);
  app.append(box);
}
render();
</script>
</body>
</html>
